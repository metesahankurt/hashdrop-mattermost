version: "3.8"

networks:
  dokploy-network:
    external: true

services:
  mm-db-init:
    image: postgres:16-alpine
    restart: "no"
    networks:
      - dokploy-network
    environment:
      PGPASSWORD: ${HASHDROP_DB_PASSWORD}
    command: >
      sh -c "
        psql -h hashdrop-hashdropdb-8eddhx -U strapi -d hashdrop-db
          -c 'CREATE DATABASE mattermost;' || true
      "

  mattermost:
    image: mattermost/mattermost-team-edition:latest
    restart: unless-stopped
    networks:
      - dokploy-network
    depends_on:
      mm-db-init:
        condition: service_completed_successfully
    ports:
      - "8065:8065"
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://strapi:${HASHDROP_DB_PASSWORD}@hashdrop-hashdropdb-8eddhx:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: ${MATTERMOST_SITE_URL:-http://localhost:8065}
      MM_SERVICESETTINGS_LISTENADDRESS: :8065
      MM_SERVICESETTINGS_ENABLEINSECUREOUTGOINGCONNECTIONS: "false"
      MM_FILESETTINGS_DRIVERNAME: local
      MM_FILESETTINGS_DIRECTORY: /mattermost/data/
      MM_LOGSETTINGS_CONSOLELEVEL: INFO
      MM_SERVICESETTINGS_ENABLEUSERAPISETTINGS: "true"
      MM_SERVICESETTINGS_ALLOWEDUNTRUSTEDINTERNALCONNECTIONS: ""
      MM_RATELIMITSETTINGS_ENABLE: "false"
    volumes:
      - mattermost-data:/mattermost/data
      - mattermost-logs:/mattermost/logs
      - mattermost-config:/mattermost/config
      - mattermost-plugins:/mattermost/plugins
      - mattermost-client-plugins:/mattermost/client/plugins
    security_opt:
      - no-new-privileges:true
    pids_limit: 200

volumes:
  mattermost-data:
  mattermost-logs:
  mattermost-config:
  mattermost-plugins:
  mattermost-client-plugins:
