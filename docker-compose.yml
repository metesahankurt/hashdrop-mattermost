version: "3.8"

networks:
  mattermost-net:
    driver: bridge

services:
  mattermost-db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - mattermost-net
    environment:
      POSTGRES_USER: mattermost
      POSTGRES_PASSWORD: ${MM_DB_PASSWORD:-mmpassword}
      POSTGRES_DB: mattermost
    volumes:
      - mattermost-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mattermost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mattermost:
    image: mattermost/mattermost-team-edition:latest
    restart: unless-stopped
    networks:
      - mattermost-net
    depends_on:
      mattermost-db:
        condition: service_healthy
    ports:
      - "8065:8065"
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mattermost:${MM_DB_PASSWORD:-mmpassword}@mattermost-db:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: ${MATTERMOST_SITE_URL:-http://localhost:8065}
      MM_SERVICESETTINGS_LISTENADDRESS: :8065
      MM_SERVICESETTINGS_ENABLEINSECUREOUTGOINGCONNECTIONS: "false"
      MM_FILESETTINGS_DRIVERNAME: local
      MM_FILESETTINGS_DIRECTORY: /mattermost/data/
      MM_LOGSETTINGS_CONSOLELEVEL: INFO
      MM_SERVICESETTINGS_ENABLEUSERAPISETTINGS: "true"
      MM_SERVICESETTINGS_ALLOWEDUNTRUSTEDINTERNALCONNECTIONS: ""
      MM_RATELIMITSETTINGS_ENABLE: "false"
    volumes:
      - mattermost-data:/mattermost/data
      - mattermost-logs:/mattermost/logs
      - mattermost-config:/mattermost/config
      - mattermost-plugins:/mattermost/plugins
      - mattermost-client-plugins:/mattermost/client/plugins
    security_opt:
      - no-new-privileges:true
    pids_limit: 200

volumes:
  mattermost-db:
  mattermost-data:
  mattermost-logs:
  mattermost-config:
  mattermost-plugins:
  mattermost-client-plugins:
